name: cityflow

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: cityflow
      POSTGRES_PASSWORD: cityflow
      POSTGRES_DB: cityflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cityflow -d cityflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Routing for travel-time estimates. Behind a profile because it cannot start
  # until an extract has been prepared:
  #   docker compose run --rm osrm-prepare
  # then: docker compose --profile routing up osrm
  osrm:
    image: osrm/osrm-backend:v5.27.1
    profiles: ["routing"]
    command: osrm-routed --algorithm mld /data/city.osrm
    ports:
      - "5000:5000"
    volumes:
      - ./osrm:/data

  osrm-prepare:
    image: osrm/osrm-backend:v5.27.1
    profiles: ["prepare"]
    entrypoint: >
      sh -c "osrm-extract -p /opt/car.lua /data/city.osm.pbf &&
             osrm-partition /data/city.osrm &&
             osrm-customize /data/city.osrm"
    volumes:
      - ./osrm:/data

volumes:
  postgres-data:
