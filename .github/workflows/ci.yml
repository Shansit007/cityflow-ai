name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm test

      # Catches what typechecking cannot: a server component importing something
      # that only runs in the browser, a route that fails to compile.
      - run: pnpm build
        env:
          AUTH_SECRET: ci-placeholder-secret-at-least-32-characters
          NEXT_TELEMETRY_DISABLED: "1"

  engine:
    name: Engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - run: ruff check .

      - run: ruff format --check .

      - run: pytest

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: cityflow
          POSTGRES_PASSWORD: cityflow
          POSTGRES_DB: cityflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cityflow -d cityflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # A migration that has never been run against a real PostGIS database is a
      # file, not a schema. This applies them in order and fails on the first error.
      - name: Apply migrations
        run: |
          for file in infra/migrations/*.sql; do
            echo "applying $file"
            psql "$DATABASE_URL" --quiet --set ON_ERROR_STOP=1 --file "$file"
          done
        env:
          DATABASE_URL: postgresql://cityflow:cityflow@127.0.0.1:5432/cityflow

      # The aggregation rule lives in SQL, so this is the only place it can be tested.
      # Each file runs in its own transaction and rolls back.
      - name: Test database functions
        run: |
          for file in infra/tests/*.sql; do
            echo "running $file"
            psql "$DATABASE_URL" --quiet --set ON_ERROR_STOP=1 --file "$file"
          done
        env:
          DATABASE_URL: postgresql://cityflow:cityflow@127.0.0.1:5432/cityflow
